# main ansible execution environment
# The controller is typically the developer container that comes with this repo
controller:
  hosts:
    localhost:
      ansible_connection: local

# Additional nodes that are not in a turing pi.
# OS pre-installed and pb_add_nodes.yml run to add them to ansible control.
# For nodes with an NVIDIA GPU, set nvidia_gpu_node: true — this installs
# the NVIDIA container toolkit and configures containerd so GPU pods work.

# extra_nodes:
#  hosts:
#    ws03:
#      nvidia_gpu_node: true # installs NVIDIA container toolkit
#      workstation: true # taint NoSchedule — only GPU + monitoring pods
#    nuc2:
#      node_ip:  # multi-homed: force K3s to use this subnet
#      flannel_iface: enp3s0 # interface carrying node_ip
#  vars:
#    ansible_user: "{{ ansible_account }}"

# Raspberry Pi cluster nodes (knode1-4) with iSCSI boot
# knode1 is the master, knode2-4 are workers
# SSH access via ansible user with key-based authentication
rpi_nodes:
  children:
    rpi_master:
      vars:
        ansible_user: "{{ rpi_ssh_user }}"
        ansible_ssh_private_key_file: "{{ rpi_ssh_private_key }}"
      hosts:
        knode1:
          ansible_host: 10.200.0.101
          rpi_node_ip: 10.200.0.101
    rpi_workers:
      vars:
        ansible_user: "{{ rpi_ssh_user }}"
        ansible_ssh_private_key_file: "{{ rpi_ssh_private_key }}"
      hosts:
        knode2:
          ansible_host: 10.200.0.102
          rpi_node_ip: 10.200.0.102
        knode3:
          ansible_host: 10.200.0.103
          rpi_node_ip: 10.200.0.103
        knode4:
          ansible_host: 10.200.0.104
          rpi_node_ip: 10.200.0.104

all_nodes:
  children:
    # turingpi_nodes:
    # turinpi2_nodes:
    extra_nodes:
    rpi_nodes:
